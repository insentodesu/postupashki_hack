name: postupashki-measurement

services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 15

  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      DB_HOST: db
      # Inside the Compose network PostgreSQL always listens on 5432.
      POSTGRES_PORT: 5432
    ports:
      - "${APP_PORT:-8501}:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      DB_HOST: db
      POSTGRES_PORT: 5432
    command: ["python", "src/bot.py"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  loader:
    build:
      context: .
      dockerfile: Dockerfile
    profiles:
      - tools
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      DB_HOST: db
      POSTGRES_PORT: 5432
      SALES_FILE: /app/data/base.xlsx
      MARKETING_FILE: /app/data/marketing_posts.csv
    volumes:
      - ./data:/app/data:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
